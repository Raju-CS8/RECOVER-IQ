[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recoveriq"
version = "0.1.0"
description = "Adaptive AI revenue recovery intelligence for Razorpay AI Builder Track 03"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["recoveriq*"]
